<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f2f0e9"><title>RouxLab</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="solver.css">
</head>
<body>
  <header class="topbar"><a class="brand" href="#"><span class="brand-mark">R</span><span>ROUXLAB</span></a><nav><a href="#cube-workbench">SOLVE</a><a href="#patterns">PATTERNS</a><a href="report.html">REPORT</a></nav><span class="engine-badge" id="engineBadge"><i></i> SOLVING</span></header>
  <main>
    <section class="workbench" id="cube-workbench" aria-label="Cube workbench">
      <div class="cube-panel"><twisty-player id="player" puzzle="3x3x3" background="none" control-panel="bottom-row" viewer-link="none" hint-facelets="floating" experimental-drag-input="auto"></twisty-player></div>
      <aside class="control-panel">
        <div class="panel-head"><h1 id="sequenceTitle">Solving…</h1><span class="move-total"><strong id="moveTotal">—</strong> moves</span></div>
        <div class="scramble-block"><textarea id="scrambleInput" spellcheck="false" rows="3" aria-label="Scramble notation"></textarea><div class="action-row"><button class="primary" id="newScramble">↻ New scramble</button><span class="edit-hint">Edits apply automatically</span></div></div>
        <div class="solver-line solving" id="solverStatus"><i></i><span>Running beginner Roux patterns…</span></div>
        <div class="sequence-block"><div class="label-row"><span>SOLUTION</span><button id="copyButton">COPY</button></div><p id="solutionText" style="white-space:pre-wrap"></p><div class="stage-list" id="stageList"></div></div>
      </aside>
    </section>
    <section class="patterns-section" id="patterns">
      <div class="pattern-grid" id="patternGrid"></div>
    </section>
  </main>
  <dialog id="patternDialog"><button class="dialog-close" id="closeDialog" aria-label="Close">×</button><div class="dialog-head"><span id="dialogStage"></span><h2 id="dialogTitle"></h2><p id="dialogDescription"></p></div><div class="case-toolbar"><span id="caseLabel"></span><div><button id="prevCase">←</button><button id="nextCase">→</button></div></div><div class="case-layout"><div class="cube-net" id="cubeNet" aria-label="Pattern cube net"></div><div class="case-details"><span>MATCHED ACTION</span><strong id="caseAlg"></strong></div></div></dialog>
  <script src="https://cdn.cubing.net/v0/js/cubing/twisty" type="module"></script><script src="app.js?v=20260923-3" type="module"></script>
</body></html>
