<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f2f0e9"><title>RouxLab</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="solver.css">
</head>
<body>
  <header class="topbar"><a class="brand" href="#"><span class="brand-mark">R</span><span>ROUXLAB</span></a><nav><a href="#cube-workbench">SOLVE</a><a href="#patterns">PATTERNS</a><a href="report.html">REPORT</a><a href="brute-force.html">BRUTE FORCE</a></nav><span class="engine-badge" id="engineBadge"><i></i> SOLVING</span></header>
  <main>
    <section class="workbench" id="cube-workbench" aria-label="Cube workbench">
      <div class="cube-panel"><twisty-player id="player" puzzle="3x3x3" background="none" control-panel="bottom-row" viewer-link="none" hint-facelets="floating" experimental-drag-input="auto"></twisty-player></div>
      <aside class="control-panel">
        <div class="panel-head"><h1 id="sequenceTitle">Solving…</h1><span class="move-total"><strong id="moveTotal">—</strong> moves</span></div>
        <div class="scramble-block"><textarea id="scrambleInput" spellcheck="false" rows="3" aria-label="Scramble notation"></textarea><div class="action-row"><button class="primary" id="newScramble">↻ New scramble</button></div><div class="search-row"><span>FIND BEST SCRAMBLE</span><select id="searchCount" aria-label="Number of random scrambles to search"><option value="10">10 scrambles</option><option value="100">100 scrambles</option><option value="1000">1,000 scrambles</option></select><select id="searchSkip" aria-label="Stage skip filter"><option value="allow">Allow stage skips</option><option value="none">Exclude stage skips</option><option value="fb">Find FB skip</option><option value="sb">Find SB skip</option><option value="cmll">Find CMLL skip</option><option value="eo">Find EO skip</option><option value="eolr">Find EOLR skip</option><option value="lse">Find full LSE skip</option></select><button id="searchButton">Search</button><span id="searchProgress" aria-live="polite"></span></div></div>
        <div class="solver-line solving" id="solverStatus"><i></i><span>Running Roux patterns…</span></div>
        <div class="sequence-block"><div class="label-row"><span>SOLUTION</span><div><a id="algLink" href="https://alg.cubing.net/" target="_blank" rel="noopener noreferrer">ALG.CUBING.NET ↗</a><button id="copyButton">COPY</button></div></div><div id="solutionText" class="solution-text"></div></div>
      </aside>
    </section>
    <section class="patterns-section" id="patterns">
      <div class="pattern-grid" id="patternGrid"></div>
      <div class="preset-row" aria-label="Solver presets">
        <button class="preset-button" id="beginnerPreset" title="Minimum-memorization Roux: beginner block building, Sune plus J-perm, and beginner edge orientation. Least efficient, but the fewest algorithms to learn." data-tooltip="Minimum memorization and the fewest algorithms, at the cost of longer solutions.">Beginner method</button>
        <button class="preset-button optimal" id="optimalPreset" title="Enable color neutrality, direct pairs, shorter pair order, one-look CMLL, center orientation, EOLR, and move cancellations for the shortest solutions currently available." data-tooltip="Enable every current optimization for the shortest solutions RouxLab can produce.">Optimal settings</button>
      </div>
    </section>
  </main>
  <dialog id="patternDialog"><button class="dialog-close" id="closeDialog" aria-label="Close">×</button><div class="dialog-head"><span id="dialogStage"></span><h2 id="dialogTitle"></h2><p id="dialogDescription"></p></div><div class="case-toolbar"><span id="caseLabel"></span><div><button id="prevCase">←</button><button id="nextCase">→</button></div></div><div class="case-layout"><div class="cube-net" id="cubeNet" aria-label="Pattern cube net"></div><div class="case-details"><span>MATCHED ACTION</span><strong id="caseAlg"></strong></div></div></dialog>
  <script src="https://cdn.cubing.net/v0/js/cubing/twisty" type="module"></script><script src="app.js?v=20260929-1" type="module"></script>
</body></html>
